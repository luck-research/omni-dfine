# ============================================================================
# Omni-DFINE -- Large variant (HGNetv2 B4) -- COCO zero-shot eval
# ----------------------------------------------------------------------------
# Paper § IV.A and Table III:
#   * Backbone: HGNetv2-B4
#   * Total params: 36.4 M
#   * FLOPs: 118.3 G
#   * FPS (A40, TensorRT FP16, batch=1): 40.2
#   * Latency (A40, batch=1): 24.9 ms
#   * COCO AP (Text prompt): 44.5 (Objects365-only) / 46.1 (O365+GoldG)
#   * COCO AP (Visual-G):     42.8 (Objects365-only)
#   * LVISminival APall (Text): 33.1 (O365) / 35.8 (O365+GoldG)
#   * 1-layer encoder, 6-layer decoder, 500 queries.
#
# Notable: Omni-DFINE-L matches Grounding DINO 1.5 Edge while using ~7% of
# its training data (paper Abstract and § I).
# ============================================================================

__include__:
  - '../dataset/coco_detection.yml'
  - '../runtime.yml'
  - './include/dataloader.yml'
  - './include/optimizer.yml'
  - './include/omni_dfine_hgnetv2.yml'


output_dir: ./output/omni_dfine_hgnetv2_l_coco


OmniDFINE:
  backbone: HGNetv2
  text_backbone: BERTTextBackbone
  prompt_encoder: LSDPE
  fusion: LWVTFE
  encoder: HybridEncoder
  decoder: DFINETransformer


# ---------------------------------------------------------------------------- #
# Image backbone -- HGNetv2 B4 (Large).
# We freeze the stem and norms to stabilize training at this scale
# (mirrors `dfine_hgnetv2_l_coco.yml`).
# ---------------------------------------------------------------------------- #
HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True


# ---------------------------------------------------------------------------- #
# Text backbone -- BERT-base (shared across variants).
# For the Large variant we unfreeze all 12 BERT layers (freeze_at=0) so the
# text branch can fine-tune on Objects365+GoldG grounding captions.
# ---------------------------------------------------------------------------- #
BERTTextBackbone:
  pretrained: 'bert-base-uncased'
  hidden_dim: 768
  text_proj_dim: 256
  freeze_at: 0
  freeze_norm: True
  max_tokens: 96
  use_cache: True


# ---------------------------------------------------------------------------- #
# Hybrid image encoder -- Large variant
# (Default `in_channels` from the include file is [512, 1024, 2048] which
# matches HGNetv2-B4; we keep expansion=1.0 and depth_mult=1.0.)
# ---------------------------------------------------------------------------- #
HybridEncoder:
  in_channels: [512, 1024, 2048]
  hidden_dim: 256
  depth_mult: 1.0
  expansion: 1.0


# ---------------------------------------------------------------------------- #
# DFINE decoder -- Large variant
# The paper specifies a 6-layer decoder for all variants; we use the full
# 6 layers and the wider auxiliary layers from D-FINE.
# ---------------------------------------------------------------------------- #
DFINETransformer:
  num_layers: 6                       # paper § IV.A
  eval_idx: -1
  num_queries: 500                    # paper § IV.A
  layer_scale: 1                       # paper does not use wide aux layers


# ---------------------------------------------------------------------------- #
# LSDPE
# ---------------------------------------------------------------------------- #
LSDPE:
  alpha: 0.9
  in_channels: 256


# ---------------------------------------------------------------------------- #
# LW-VTFE
# ---------------------------------------------------------------------------- #
LWVTFE:
  embed_dim: 256
  tau_init: 0.1


# ---------------------------------------------------------------------------- #
# Optimizer -- Large variant
# Mirrors `dfine_hgnetv2_l_coco.yml`'s lower backbone lr; we use the paper's
# 5e-5 for the text branch to give BERT enough signal during fine-tuning.
# ---------------------------------------------------------------------------- #
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125                   # D-FINE-L setting
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0000125
      weight_decay: 0.
    -
      params: '^(?=.*text_backbone)(?!.*norm|bn).*$'
      lr: 0.00005                    # paper § IV.A
    -
      params: '^(?=.*text_backbone)(?=.*norm|bn).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder|fusion|prompt_encoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125


# ---------------------------------------------------------------------------- #
# Schedule -- 20 epochs (paper § IV.A)
# The Large variant uses fewer `base_size_repeat` iterations because the
# backbone is heavier.
# ---------------------------------------------------------------------------- #
epochs: 20
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 16
  collate_fn:
    stop_epoch: 16
    ema_restart_decay: 0.9999
    base_size_repeat: 4


seed: 0
